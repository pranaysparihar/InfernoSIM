name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
      - name: Verify module files
        run: go mod tidy -diff
      - name: Verify Testcontainers module files
        working-directory: integrations/testcontainers-go
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Vet Testcontainers adapter
        working-directory: integrations/testcontainers-go
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Run release tests
        run: go test -count=1 -race ./...
      - name: Run Testcontainers adapter tests
        working-directory: integrations/testcontainers-go
        run: go test -count=1 -race ./...
      - name: Validate shell, workflow, and generated agent harnesses
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          go run ./cmd/agent testgen examples/agent-reliability --profile agent --framework github-actions --out dist/release-agent-actions
          go run ./cmd/agent testgen examples/agent-reliability --profile agent --framework docker-compose --out dist/release-agent-compose
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 dist/release-agent-actions/infernosim-ci.yaml
          docker compose -f dist/release-agent-compose/compose.infernosim.yaml config >/dev/null
      - name: Build release candidate container
        run: docker build --tag infernosim:release-test .
      - name: Run real Testcontainers incident smoke
        working-directory: integrations/testcontainers-go
        env:
          INFERNOSIM_TEST_IMAGE: infernosim:release-test
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -count=1 -run TestContainerIntegration -v ./...
      - name: Verify deterministic incident-to-test baseline
        run: go run ./cmd/benchmark --runs 100 --out /tmp/infernosim-benchmark.json
      - name: Verify deterministic agent reliability controls
        run: scripts/agent-smoke.sh
      - name: Verify agent reliability benchmark contract
        run: |
          work_dir="$(mktemp -d)"
          go build -trimpath -o "$work_dir/agentlab" ./examples/agentlab
          go run ./cmd/agentbenchmark --runs 20 --agent-command "$work_dir/agentlab" --out /tmp/infernosim-agent-benchmark.json
      - name: Kafka and AsyncAPI Redpanda smoke
        run: scripts/kafka-smoke.sh
      - name: Publish release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
