name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './dist/*'))"
      - name: Verify module files
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Build CLI
        run: go build -trimpath -o /tmp/infernosim ./cmd/agent
      - name: Validate shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Validate Compose
        run: docker compose -f docker-compose.yml -f docker-compose.examples.yml config >/dev/null
