services:
  infernosim-capture:
    image: infernosim:local
    user: "${INFERNOSIM_UID:-65532}:${INFERNOSIM_GID:-65532}"
    volumes:
      - ${INCIDENT_DIR:-./.incident}:/incident
    command:
      - "--mode=proxy"
      - "--listen=:19000"
      - "--log=/incident/outbound.log"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "19000"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s
    expose:
      - "19000"
