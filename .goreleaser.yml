version: 2
# .goreleaser.yml for InfernoSIM v4
builds:
  - id: infernosim
    binary: infernosim
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch: [386, amd64, arm64]
    goamd64: [v1]
    ignore:
      - goos: darwin
        goarch: 386
    main: ./cmd/agent
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.versionBy=goreleaser -X infernosim/pkg/reporting.SemanticVersion={{.Version}}
archives:
  - id: infernosim-archive
    ids: [infernosim]
    # One amd64 baseline only: eight archives + checksums, plus GitHub's two
    # automatic source archives = the established eleven release assets.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: 'checksums.txt'
  algorithm: sha256
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
